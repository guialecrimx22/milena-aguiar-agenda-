<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Millena Aguiar | Nail Designer - Gestão Interna</title>
  
  <!-- Fontes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* VARIABLES & RESET */
    :root {
      --bg-top: #FFFFFF;
      --bg-bottom: #D9C8B4;
      --gold-primary: #B38F4F;
      --gold-light: #D4B26F;
      --gold-glow: rgba(212, 178, 111, 0.6);
      --text-dark: #2C2825;
      --text-muted: #6E6862;
      --card-bg: rgba(255, 255, 255, 0.94);
      --border-color: #E6DCD1;
      --radius: 14px;
      --shadow: 0 10px 25px rgba(0,0,0,0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      color: var(--text-dark);
      background-color: var(--bg-top);
      position: relative;
      overflow-x: hidden;
      padding-bottom: 40px;
    }

    /* BACKGROUND SPLIT COM LED NEON */
    .bg-split-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      pointer-events: none;
    }

    .bg-bottom-wall {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60%;
      background-color: var(--bg-bottom);
      clip-path: path("M 0 60 Q 200 120, 400 50 T 800 80 T 1200 40 T 1600 90 T 2000 50 L 2000 1000 L 0 1000 Z");
    }

    .led-neon-strip {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    /* HEADER & LOGO RESPONSIVO */
    header {
      text-align: center;
      padding: 30px 15px 15px 15px;
      position: relative;
    }

    .logo-container {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }

    .logo-svg {
      width: 100%;
      max-width: 320px;
      height: auto;
      filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.08));
    }

    .brand-name {
      font-size: 1.25rem;
      font-weight: 500;
      letter-spacing: 0.28em;
      color: var(--text-dark);
      margin-top: -6px;
      text-transform: uppercase;
    }

    .brand-subtitle-wrapper {
      display: flex;
      align-items: center;
      width: 100%;
      margin-top: 6px;
    }

    .line-left, .line-right {
      flex: 1;
      height: 1px;
      background-color: var(--gold-primary);
    }

    .brand-subtitle {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: var(--gold-primary);
      padding: 0 10px;
      white-space: nowrap;
    }

    /* APP CONTAINER RESPONSIVO (GRID) */
    .app-container {
      max-width: 1100px;
      margin: 15px auto;
      padding: 0 15px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    /* TELA GRANDE (DESKTOP): 2 COLUNAS */
    @media (min-width: 850px) {
      header {
        padding: 40px 20px 20px 20px;
      }

      .logo-svg {
        max-width: 380px;
      }

      .brand-name {
        font-size: 1.5rem;
        letter-spacing: 0.35em;
      }

      .brand-subtitle {
        font-size: 0.75rem;
        letter-spacing: 0.25em;
      }

      .app-container {
        grid-template-columns: 360px 1fr;
        gap: 25px;
        margin: 20px auto;
        padding: 0 20px;
      }
    }

    /* CARDS */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: var(--radius);
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
    }

    /* FORMULÁRIOS ADAPTÁVEIS */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      background-color: #FFF;
      color: var(--text-dark);
      outline: none;
      transition: all 0.2s;
    }

    .form-control:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 0 3px var(--gold-glow);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
      color: #FFF;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 12px var(--gold-glow);
      margin-top: 5px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* CARDS DASHBOARD (RESPONSIVO) */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    @media (min-width: 600px) {
      .stats-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
      }
    }

    .stat-card {
      background: #FFF;
      padding: 14px 16px;
      border-radius: 10px;
      border-left: 4px solid var(--gold-primary);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .stat-card.full-width-mobile {
      grid-column: span 2;
    }

    @media (min-width: 600px) {
      .stat-card.full-width-mobile {
        grid-column: span 1;
      }
    }

    .stat-card .label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .stat-card .value {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-top: 4px;
    }

    /* LISTA DE AGENDAMENTOS */
    .agenda-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .agenda-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .agenda-item {
      background: #FFF;
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid var(--border-color);
      transition: border-color 0.2s;
    }

    @media (min-width: 500px) {
      .agenda-item {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .agenda-item.blocked {
      background-color: #FAF6F0;
      border-left: 4px solid var(--gold-primary);
    }

    .agenda-item.completed {
      border-left: 4px solid #4CAF50;
      background-color: #F4FBF4;
    }

    .agenda-info h4 {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text-dark);
    }

    .agenda-info p {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .agenda-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-top: 1px solid #F0ECE6;
      padding-top: 10px;
    }

    @media (min-width: 500px) {
      .agenda-actions {
        border-top: none;
        padding-top: 0;
        justify-content: flex-end;
      }
    }

    .agenda-badge {
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    .badge-pix { background: #E3F2FD; color: #1565C0; }
    .badge-crédito { background: #EDE7F6; color: #4A148C; }
    .badge-débito { background: #FFF3E0; color: #E65100; }
    .badge-dinheiro { background: #E8F5E9; color: #1B5E20; }

    .btn-status {
      background: #FFF;
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-dark);
    }

    .action-btn-del {
      background: none;
      border: none;
      color: #E53935;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 6px;
    }

    .empty-state {
      text-align: center;
      padding: 30px 15px;
      color: var(--text-muted);
      font-size: 0.88rem;
    }
  </style>
</head>
<body>

  <!-- BACKGROUND SPLIT & LED NEON -->
  <div class="bg-split-container">
    <div class="bg-bottom-wall"></div>
    <svg class="led-neon-strip" viewBox="0 0 2000 1000" preserveAspectRatio="none">
      <path d="M 0 60 Q 200 120, 400 50 T 800 80 T 1200 40 T 1600 90 T 2000 50" 
            fill="none" stroke="#FFE082" stroke-width="8" filter="drop-shadow(0px 0px 12px #FFB300)" />
      <path d="M 0 60 Q 200 120, 400 50 T 800 80 T 1200 40 T 1600 90 T 2000 50" 
            fill="none" stroke="#FFFFFF" stroke-width="3" />
    </svg>
  </div>

  <!-- HEADER / LOGO -->
  <header>
    <div class="logo-container">
      <svg class="logo-svg" viewBox="0 0 500 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#997535" />
            <stop offset="50%" stop-color="#CBB079" />
            <stop offset="100%" stop-color="#8E6A2A" />
          </linearGradient>
        </defs>
        <!-- Flourish Esquerda + M e A Fluídos + Flourish Direita -->
        <path d="M 20,45 C 50,85 100,75 140,52 C 150,48 158,58 162,75 C 165,88 172,92 178,72 C 185,50 195,48 202,70 C 206,82 212,88 218,68 C 228,38 245,45 238,72 C 235,85 242,90 252,75 C 265,55 285,48 295,65 C 302,77 292,92 280,88 C 270,85 272,70 285,62 C 298,54 315,50 340,55 C 380,62 430,25 480,35" 
              stroke="url(#goldGradient)" stroke-width="4.5" stroke-linecap="round" fill="none" />
      </svg>
      
      <h1 class="brand-name">MILLENA AGUIAR</h1>
      <div class="brand-subtitle-wrapper">
        <div class="line-left"></div>
        <span class="brand-subtitle">NAIL DESIGNER</span>
        <div class="line-right"></div>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL (ADAPTATIVO) -->
  <main class="app-container">
    
    <!-- COLUNA 1: AGENDAMENTO -->
    <section class="card">
      <div class="card-title">
        <span>Novo Agendamento</span>
      </div>

      <form id="bookingForm">
        <div class="form-group">
          <label>Nome da Cliente</label>
          <input type="text" id="clientName" class="form-control" placeholder="Ex: Maria Silva" required>
        </div>

        <div class="form-group">
          <label>Procedimento</label>
          <select id="serviceSelect" class="form-control" required onchange="updateDuration()">
            <option value="Unha em Gel" data-time="120" data-price="150">Unha em Gel (2h) - R$ 150</option>
            <option value="Manutenção Gel" data-time="90" data-price="100">Manutenção Gel (1h 30m) - R$ 100</option>
            <option value="Banho de Gel" data-time="90" data-price="90">Banho de Gel (1h 30m) - R$ 90</option>
            <option value="Esmaltação em Gel" data-time="60" data-price="70">Esmaltação em Gel (1h) - R$ 70</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Data</label>
            <input type="date" id="appDate" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Horário</label>
            <input type="time" id="appTime" class="form-control" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Duração (min)</label>
            <input type="number" id="appDuration" class="form-control" value="120" readonly>
          </div>
          <div class="form-group">
            <label>Valor (R$)</label>
            <input type="number" id="appPrice" class="form-control" value="150" required>
          </div>
        </div>

        <div class="form-group">
          <label>Forma de Pagamento</label>
          <select id="paymentMethod" class="form-control" required>
            <option value="Pix">Pix</option>
            <option value="Crédito">Cartão de Crédito</option>
            <option value="Débito">Cartão de Débito</option>
            <option value="Dinheiro">Dinheiro</option>
          </select>
        </div>

        <button type="submit" class="btn">Confirmar Agendamento</button>
      </form>
    </section>

    <!-- COLUNA 2: ESTATÍSTICAS E AGENDA -->
    <section>
      
      <!-- DASHBOARD ESTATÍSTICO -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="label">Clientes Hoje</div>
          <div class="value" id="totalClientsToday">0</div>
        </div>
        <div class="stat-card">
          <div class="label">Faturamento Hoje</div>
          <div class="value" id="totalRevenueToday">R$ 0,00</div>
        </div>
        <div class="stat-card full-width-mobile">
          <div class="label">Total no Mês</div>
          <div class="value" id="totalRevenueMonth">R$ 0,00</div>
        </div>
      </div>

      <!-- PAINEL DA AGENDA -->
      <div class="card">
        <div class="agenda-header">
          <div class="card-title" style="border:none; margin:0; padding:0;">
            <span>Agenda do Dia</span>
          </div>
          <input type="date" id="filterDate" class="form-control" style="width: auto; padding: 6px 10px;">
        </div>

        <div id="agendaList" class="agenda-list">
          <!-- Item renderizado dinamicamente -->
        </div>
      </div>

    </section>

  </main>

  <!-- LÓGICA JAVASCRIPT -->
  <script>
    let appointments = JSON.parse(localStorage.getItem('ma_appointments')) || [];

    const todayStr = new Date().toISOString().split('T')[0];
    document.getElementById('appDate').value = todayStr;
    document.getElementById('filterDate').value = todayStr;

    function updateDuration() {
      const select = document.getElementById('serviceSelect');
      const selectedOption = select.options[select.selectedIndex];
      document.getElementById('appDuration').value = selectedOption.getAttribute('data-time');
      document.getElementById('appPrice').value = selectedOption.getAttribute('data-price');
    }

    function isTimeSlotConflicting(date, startTime, durationMin) {
      const start = new Date(`${date}T${startTime}`);
      const end = new Date(start.getTime() + durationMin * 60000);

      return appointments.some(app => {
        if (app.date !== date) return false;
        const appStart = new Date(`${app.date}T${app.time}`);
        const appEnd = new Date(appStart.getTime() + app.duration * 60000);

        return (start < appEnd && end > appStart);
      });
    }

    document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const date = document.getElementById('appDate').value;
      const time = document.getElementById('appTime').value;
      const duration = parseInt(document.getElementById('appDuration').value);
      const client = document.getElementById('clientName').value;
      const service = document.getElementById('serviceSelect').value;
      const price = parseFloat(document.getElementById('appPrice').value);
      const payment = document.getElementById('paymentMethod').value;

      if (isTimeSlotConflicting(date, time, duration)) {
        alert('⚠️ Horário Ocupado! Já existe um agendamento nesse intervalo. Escolha outro horário.');
        return;
      }

      const newAppointment = {
        id: Date.now(),
        client,
        service,
        date,
        time,
        duration,
        price,
        payment,
        status: 'agendado'
      };

      appointments.push(newAppointment);
      saveAndRender();
      this.reset();
      document.getElementById('appDate').value = date;
      updateDuration();
    });

    function deleteAppointment(id) {
      if (confirm('Deseja cancelar este agendamento?')) {
        appointments = appointments.filter(app => app.id !== id);
        saveAndRender();
      }
    }

    function toggleStatus(id) {
      appointments = appointments.map(app => {
        if (app.id === id) {
          app.status = app.status === 'agendado' ? 'concluido' : 'agendado';
        }
        return app;
      });
      saveAndRender();
    }

    function saveAndRender() {
      localStorage.setItem('ma_appointments', JSON.stringify(appointments));
      renderAgenda();
      renderStats();
    }

    function getEndTime(timeStr, durationMin) {
      const [h, m] = timeStr.split(':').map(Number);
      const totalM = h * 60 + m + durationMin;
      const endH = Math.floor(totalM / 60) % 24;
      const endM = totalM % 60;
      return `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
    }

    function renderAgenda() {
      const filterDate = document.getElementById('filterDate').value;
      const agendaList = document.getElementById('agendaList');
      agendaList.innerHTML = '';

      const filtered = appointments
        .filter(app => app.date === filterDate)
        .sort((a, b) => a.time.localeCompare(b.time));

      if (filtered.length === 0) {
        agendaList.innerHTML = `<div class="empty-state">Nenhum agendamento para esta data.</div>`;
        return;
      }

      filtered.forEach(app => {
        const endTime = getEndTime(app.time, app.duration);
        const item = document.createElement('div');
        item.className = `agenda-item ${app.status === 'concluido' ? 'completed' : 'blocked'}`;
        
        item.innerHTML = `
          <div class="agenda-info">
            <h4>${app.client}</h4>
            <p><strong>${app.service}</strong> (${app.duration} min)</p>
            <p><strong>${app.time} às ${endTime}</strong> | R$ ${app.price.toFixed(2)}</p>
          </div>
          <div class="agenda-actions">
            <span class="agenda-badge badge-${app.payment.toLowerCase()}">${app.payment}</span>
            <button class="btn-status" onclick="toggleStatus(${app.id})">
              ${app.status === 'concluido' ? '✓ Concluído' : 'Concluir'}
            </button>
            <button class="action-btn-del" onclick="deleteAppointment(${app.id})">Excluir</button>
          </div>
        `;
        agendaList.appendChild(item);
      });
    }

    function renderStats() {
      const selectedDate = document.getElementById('filterDate').value;
      const currentMonth = selectedDate.substring(0, 7);

      const todayApps = appointments.filter(app => app.date === selectedDate);
      const monthApps = appointments.filter(app => app.date.startsWith(currentMonth));

      const totalClientsToday = todayApps.length;
      const totalRevenueToday = todayApps.reduce((acc, app) => acc + app.price, 0);
      const totalRevenueMonth = monthApps.reduce((acc, app) => acc + app.price, 0);

      document.getElementById('totalClientsToday').innerText = totalClientsToday;
      document.getElementById('totalRevenueToday').innerText = `R$ ${totalRevenueToday.toFixed(2)}`;
      document.getElementById('totalRevenueMonth').innerText = `R$ ${totalRevenueMonth.toFixed(2)}`;
    }

    document.getElementById('filterDate').addEventListener('change', renderAgenda);

    // INICIALIZAR
    saveAndRender();
  </script>
</body>
</html>
